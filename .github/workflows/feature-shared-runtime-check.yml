name: Shared runtime feature check

on:
  push:
    branches:
      - fix/shared-runtime-packaging

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: windows-2022

    steps:
      - name: Check out source
        shell: pwsh
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $credentials = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPOSITORY_TOKEN")
          )
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -c "http.extraHeader=Authorization: Basic $credentials" fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git checkout --detach $env:GITHUB_SHA

      - name: Run modern checks and build
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: "true"
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run --project "tests\DeckBuilder.Core.Checks\DeckBuilder.Core.Checks.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Modern core checks failed with exit code $LASTEXITCODE." }
          dotnet run --project "tests\DeckBuilder.Modern.Checks\DeckBuilder.Modern.Checks.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Modern WPF checks failed with exit code $LASTEXITCODE." }
          dotnet build "src\DeckBuilder.Modern\DeckBuilder.Modern.csproj" --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Modern Release build failed with exit code $LASTEXITCODE." }

      - name: Report feature check status
        if: ${{ always() }}
        shell: pwsh
        env:
          BUILD_RESULT: ${{ job.status }}
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $state = if ($env:BUILD_RESULT -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") {
            "Shared-runtime core/WPF checks and Release build passed."
          }
          else {
            "Shared-runtime feature checks failed; open the run log."
          }
          $body = @{
            state = $state
            context = "Feature check / shared runtime"
            description = $description
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:REPOSITORY_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body | Out-Null
