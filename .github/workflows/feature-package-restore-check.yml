name: Feature package restore check

on:
  push:
    branches:
      - fix/package-restore-compact-auto-lands
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Mark feature check pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Feature check / package restore',
              description: 'Windows validation is running'
            });
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core checks
        run: dotnet run --project tests\DeckBuilder.Core.Checks\DeckBuilder.Core.Checks.csproj --configuration Release
      - name: Modern checks
        run: dotnet run --project tests\DeckBuilder.Modern.Checks\DeckBuilder.Modern.Checks.csproj --configuration Release
      - name: Release build
        run: dotnet build src\DeckBuilder.Modern\DeckBuilder.Modern.csproj --configuration Release --no-restore
      - name: Publish feature check status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Feature check / package restore',
              description: state === 'success' ? 'Windows validation passed' : 'Windows validation failed'
            });
