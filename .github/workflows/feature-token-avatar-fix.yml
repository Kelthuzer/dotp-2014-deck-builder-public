name: Feature token and avatar fix

on:
  push:
    branches: [fix/token-runtime-and-ai-avatar]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Check out feature branch
        shell: pwsh
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $credentials = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPOSITORY_TOKEN"))
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -c "http.extraHeader=Authorization: Basic $credentials" fetch --no-tags origin "refs/heads/$env:GITHUB_REF_NAME"
          git checkout -B "$env:GITHUB_REF_NAME" FETCH_HEAD

      - name: Apply compatibility fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $text = [IO.File]::ReadAllText($Path)
            if (-not $text.Contains($Old)) {
              throw "Expected patch anchor was not found in $Path`n--- anchor ---`n$Old"
            }
            $text = $text.Replace($Old, $New)
            [IO.File]::WriteAllText($Path, $text, [Text.UTF8Encoding]::new($false))
          }

          # Fix the generated regex literal itself before compiling.
          $path = "src/DeckBuilder.GameData/WorkspaceRuntimeCompatibility.cs"
          $text = [IO.File]::ReadAllText($path)
          $bad = @'
        @"(?i)\bCW_Tokens\s*\(\s*[\""']([^\""'\r\n]+)[\""']",
'@
          $good = @'
        "(?i)\\bCW_Tokens\\s*\\(\\s*[\\\"']([^\\\"'\\r\\n]+)[\\\"']",
'@
          if (-not $text.Contains($bad.TrimEnd("`r","`n"))) { throw "CW_Tokens regex anchor missing" }
          $text = $text.Replace($bad.TrimEnd("`r","`n"), $good.TrimEnd("`r","`n"))
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

          # Legacy/community CARD_V2 files can contain markup the game accepts but XDocument rejects.
          $path = "src/DeckBuilder.GameData/CardXmlParser.cs"
          Replace-Exact $path `
            '        XDocument document = XDocument.Parse(xml, LoadOptions.None);' `
            @'
        XDocument document;
        try
        {
            document = XDocument.Parse(xml, LoadOptions.None);
        }
        catch
        {
            return CardXmlFallbackParser.TryParse(xml, source);
        }
'@.TrimEnd("`r","`n")
          Replace-Exact $path `
            '            return null;`r`n        }`r`n`r`n        string fileName = Attribute(Child(card, "FILENAME"), "text");' `
            '            return CardXmlFallbackParser.TryParse(xml, source);`r`n        }`r`n`r`n        string fileName = Attribute(Child(card, "FILENAME"), "text");'
          Replace-Exact $path `
            '        if (string.IsNullOrWhiteSpace(fileName))`r`n        {`r`n            return null;`r`n        }' `
            '        if (string.IsNullOrWhiteSpace(fileName))`r`n        {`r`n            return CardXmlFallbackParser.TryParse(xml, source);`r`n        }'

          # CW_Tokens-generated registrations are not necessarily standalone CARD_V2 files. If a
          # standalone token exists we still package it; otherwise runtime compatibility owns it.
          $path = "src/DeckBuilder.GameData/WorkspaceCardDependencyResolver.cs"
          Replace-Exact $path `
            '        HashSet<string> missingTokens = new(StringComparer.OrdinalIgnoreCase);' `
            '        HashSet<string> missingTokens = new(StringComparer.OrdinalIgnoreCase);`r`n        IReadOnlyList<string> cwTokenKeys = WorkspaceRuntimeCompatibility.ExtractCwTokenKeys(xml);'
          Replace-Exact $path `
            '            else if (registeredToken.StartsWith("TOKEN_", StringComparison.Ordinal))`r`n                missingTokens.Add(registeredToken);' `
            '            else if (registeredToken.StartsWith("TOKEN_", StringComparison.Ordinal)`r`n                     && !WorkspaceRuntimeCompatibility.IsDynamicCwRegistration(registeredToken, cwTokenKeys))`r`n                missingTokens.Add(registeredToken);'

          # Prefer duplicate FUNCTIONS resources that actually cover the CW_Tokens archetypes used
          # by the cards in this workspace, then preserve normal WAD priority as the tie-breaker.
          $path = "src/DeckBuilder.GameData/WorkspacePortableRuntimeIndex.cs"
          Replace-Exact $path `
            '    private readonly IReadOnlyList<string> _implicitSharedPaths;' `
            '    private readonly IReadOnlyList<string> _implicitSharedPaths;`r`n    private readonly IReadOnlySet<string> _missingCwTokenKeys;'
          Replace-Exact $path `
            '        IReadOnlyDictionary<string, RuntimeResource[]> resourcesByGlobalAlias,`r`n        IReadOnlyList<string> implicitSharedPaths)' `
            '        IReadOnlyDictionary<string, RuntimeResource[]> resourcesByGlobalAlias,`r`n        IReadOnlyList<string> implicitSharedPaths,`r`n        IReadOnlySet<string> missingCwTokenKeys)'
          Replace-Exact $path `
            '        _resourcesByGlobalAlias = resourcesByGlobalAlias;`r`n        _implicitSharedPaths = implicitSharedPaths;' `
            '        _resourcesByGlobalAlias = resourcesByGlobalAlias;`r`n        _implicitSharedPaths = implicitSharedPaths;`r`n        _missingCwTokenKeys = missingCwTokenKeys;'
          Replace-Exact $path `
            '        string workspace = Path.GetFullPath(workspaceDirectory);' `
            '        string workspace = Path.GetFullPath(workspaceDirectory);`r`n        IReadOnlySet<string> workspaceCwTokenKeys = WorkspaceRuntimeCompatibility.ScanWorkspaceCwTokenKeys(workspace, cancellationToken);'
          Replace-Exact $path `
            '            .Select(group => group`r`n                .OrderBy(resource => resource.WadOrder)' `
            '            .Select(group => group`r`n                .OrderBy(resource => WorkspaceRuntimeCompatibility.CountCwTokenCoverage(`r`n                    resource.RelativePath, resource.StoragePath, workspaceCwTokenKeys))`r`n                .ThenBy(resource => resource.WadOrder)'
          Replace-Exact $path `
            '        Dictionary<string, RuntimeResource> resourcesByPath = effective.ToDictionary(' `
            @'
        IReadOnlySet<string> availableCwTokenKeys = WorkspaceRuntimeCompatibility.FindAvailableCwTokenKeys(
            effective.Select(resource => (resource.RelativePath, resource.StoragePath)),
            workspaceCwTokenKeys);
        HashSet<string> missingCwTokenKeys = workspaceCwTokenKeys
            .Where(key => !availableCwTokenKeys.Contains(key))
            .ToHashSet(StringComparer.OrdinalIgnoreCase);

        Dictionary<string, RuntimeResource> resourcesByPath = effective.ToDictionary(
'@.TrimEnd("`r","`n")
          Replace-Exact $path `
            '            aliasIndexes.Globals,`r`n            implicitSharedPaths);' `
            '            aliasIndexes.Globals,`r`n            implicitSharedPaths,`r`n            missingCwTokenKeys);'
          Replace-Exact $path `
            '        if (discoverCardReferences)`r`n            ScanRuntimeCardReferences(text, cardAliases, cardReferences);' `
            @'
        foreach (string cwTokenKey in WorkspaceRuntimeCompatibility.ExtractCwTokenKeys(text))
        {
            if (_missingCwTokenKeys.Contains(cwTokenKey))
            {
                throw new InvalidDataException(
                    $"CW_Tokens archetype '{cwTokenKey}' used by {sourceLabel} is absent from the effective FUNCTIONS runtime. " +
                    "The workspace contains a card newer than its CW token table; refresh/re-extract the matching Community WAD runtime before packaging.");
            }
        }

        if (discoverCardReferences)
            ScanRuntimeCardReferences(text, cardAliases, cardReferences);
'@.TrimEnd("`r","`n")
          Replace-Exact $path `
            '        new Dictionary<string, RuntimeResource[]>(StringComparer.OrdinalIgnoreCase),`r`n        Array.Empty<string>());' `
            '        new Dictionary<string, RuntimeResource[]>(StringComparer.OrdinalIgnoreCase),`r`n        Array.Empty<string>(),`r`n        new HashSet<string>(StringComparer.OrdinalIgnoreCase));'

          # The shared-runtime verifier must choose the same compatibility-aware source bytes.
          $path = "src/DeckBuilder.GameData/WorkspaceSharedRuntimeContract.cs"
          Replace-Exact $path `
            '        List<WorkspaceRuntimeSource> candidates = new();' `
            '        IReadOnlySet<string> workspaceCwTokenKeys = WorkspaceRuntimeCompatibility.ScanWorkspaceCwTokenKeys(workspace, cancellationToken);`r`n        List<WorkspaceRuntimeSource> candidates = new();'
          Replace-Exact $path `
            '            .Select(group => group`r`n                .OrderBy(source => source.WadOrder)' `
            '            .Select(group => group`r`n                .OrderBy(source => WorkspaceRuntimeCompatibility.CountCwTokenCoverage(`r`n                    source.RelativePath, source.StoragePath, workspaceCwTokenKeys))`r`n                .ThenBy(source => source.WadOrder)'

          # Never export/package a newly-created deck with an empty AI personality.
          $path = "src/DeckBuilder.Modern/MainWindow.PackageDeck.cs"
          Replace-Exact $path `
            '        if (!await EnsurePackagingWorkspaceAsync())`r`n            return;`r`n`r`n        DeckPackageWizardWindow wizard' `
            '        if (!await EnsurePackagingWorkspaceAsync())`r`n            return;`r`n        if (!await EnsureDeckPersonalityAsync())`r`n            return;`r`n`r`n        DeckPackageWizardWindow wizard'

          $path = "src/DeckBuilder.Modern/MainWindow.xaml.cs"
          $old = @'
        if (_deck.MainDeckCardCount == 0)
        {
            MessageBox.Show(
                "Add at least one card to the main deck before exporting.",
                "Empty deck",
                MessageBoxButton.OK,
                MessageBoxImage.Information);
            return;
        }

        int slot;
'@
          $new = @'
        if (_deck.MainDeckCardCount == 0)
        {
            MessageBox.Show(
                "Add at least one card to the main deck before exporting.",
                "Empty deck",
                MessageBoxButton.OK,
                MessageBoxImage.Information);
            return;
        }

        if (!await EnsureDeckPersonalityAsync())
            return;

        int slot;
'@
          Replace-Exact $path $old.TrimEnd("`r","`n") $new.TrimEnd("`r","`n")

      - name: Run modern checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run --project "tests/DeckBuilder.Core.Checks/DeckBuilder.Core.Checks.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Core checks failed" }
          dotnet run --project "tests/DeckBuilder.Modern.Checks/DeckBuilder.Modern.Checks.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Modern checks failed" }
          dotnet publish "src/DeckBuilder.Modern/DeckBuilder.Modern.csproj" --configuration Release --runtime win-x64 --self-contained true --output "$env:RUNNER_TEMP/publish"
          if ($LASTEXITCODE -ne 0) { throw "Modern publish failed" }

      - name: Commit verified patch
        shell: pwsh
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item ".github/workflows/feature-token-avatar-fix.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            "src/DeckBuilder.GameData/WorkspaceRuntimeCompatibility.cs" `
            "src/DeckBuilder.GameData/CardXmlFallbackParser.cs" `
            "src/DeckBuilder.GameData/CardXmlParser.cs" `
            "src/DeckBuilder.GameData/GamePersonalityFallbackSelector.cs" `
            "src/DeckBuilder.GameData/WorkspaceCardDependencyResolver.cs" `
            "src/DeckBuilder.GameData/WorkspacePortableRuntimeIndex.cs" `
            "src/DeckBuilder.GameData/WorkspaceSharedRuntimeContract.cs" `
            "src/DeckBuilder.Modern/MainWindow.PersonalitySafety.cs" `
            "src/DeckBuilder.Modern/MainWindow.PackageDeck.cs" `
            "src/DeckBuilder.Modern/MainWindow.xaml.cs" `
            "tests/DeckBuilder.Core.Checks/RuntimeCompatibilityChecks.cs" `
            "tests/DeckBuilder.Core.Checks/LenientCardIdentityChecks.cs" `
            "tests/DeckBuilder.Core.Checks/PersonalityFallbackChecks.cs" `
            ".github/workflows/feature-token-avatar-fix.yml"
          git diff --cached --check
          git commit -m "Fix CW token runtime compatibility and AI avatars [skip ci]"
          $credentials = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPOSITORY_TOKEN"))
          git -c "http.extraHeader=Authorization: Basic $credentials" push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
