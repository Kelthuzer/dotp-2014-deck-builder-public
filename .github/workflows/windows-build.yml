name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: windows-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source without external actions
        shell: pwsh
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $credentials = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:REPOSITORY_TOKEN")
          )
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -c "http.extraHeader=Authorization: Basic $credentials" fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git checkout --detach $env:GITHUB_SHA

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packageRoot = Join-Path $env:RUNNER_TEMP "reference-assemblies"
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 `
            -DirectDownload `
            -ExcludeVersion `
            -Version 1.0.3 `
            -OutputDirectory $packageRoot
          $frameworkRoot = Join-Path $packageRoot "Microsoft.NETFramework.ReferenceAssemblies.net40\build"
          $clientProfile = Join-Path $frameworkRoot ".NETFramework\v4.0\Profile\Client\RedistList\FrameworkList.xml"
          if (-not (Test-Path $clientProfile)) {
            throw "The .NET Framework 4.0 Client Profile reference assemblies were not installed."
          }
          "FRAMEWORK_ROOT=$frameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x86 and x64 releases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found on the Windows runner."
          }

          foreach ($platform in @("x86", "x64")) {
            & $msbuild "DotP 2014 Deck Builder.sln" `
              /m `
              /t:Rebuild `
              /p:Configuration=Release `
              /p:Platform=$platform `
              /p:RestorePackages=false `
              "/p:TargetFrameworkRootPath=$env:FRAMEWORK_ROOT\"
            if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed for $platform with exit code $LASTEXITCODE."
            }
          }

      - name: Build and verify modern .NET 8 application
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: "true"
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run `
            --project "tests\DeckBuilder.Core.Checks\DeckBuilder.Core.Checks.csproj" `
            --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "Modern core checks failed with exit code $LASTEXITCODE."
          }
          dotnet run `
            --project "tests\DeckBuilder.Modern.Checks\DeckBuilder.Modern.Checks.csproj" `
            --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "Modern WPF symbol checks failed with exit code $LASTEXITCODE."
          }
          $buildId = "b$env:GITHUB_RUN_NUMBER-$($env:GITHUB_SHA.Substring(0, 7))"
          dotnet publish `
            "src\DeckBuilder.Modern\DeckBuilder.Modern.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output "artifacts\modern-x64" `
            -p:PublishSingleFile=true `
            -p:BuildIdentifier=$buildId
          if ($LASTEXITCODE -ne 0) {
            throw "Modern WPF publish failed with exit code $LASTEXITCODE."
          }
          $modernExe = "artifacts\modern-x64\DotP 2014 Deck Builder Modern.exe"
          if (-not (Test-Path $modernExe)) {
            throw "The modern executable was not produced."
          }
          $nativeDecoder = "artifacts\modern-x64\squish_64.dll"
          if (-not (Test-Path $nativeDecoder)) {
            throw "The original x64 Squish card-art decoder was not published beside the modern executable."
          }

      - name: Package modern release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive `
            -Path "artifacts\modern-x64\*" `
            -DestinationPath "artifacts\dotp-2014-deck-builder-modern-x64.zip" `
            -Force

      - name: Publish continuous build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $asset = (Resolve-Path "artifacts\dotp-2014-deck-builder-modern-x64.zip").Path
          $assetName = Split-Path $asset -Leaf

          gh release view continuous --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingAssets = @(gh release view continuous --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
            foreach ($existingAsset in $existingAssets) {
              if (-not [string]::IsNullOrWhiteSpace($existingAsset)) {
                gh release delete-asset continuous $existingAsset --yes --repo $env:GITHUB_REPOSITORY
                if ($LASTEXITCODE -ne 0) {
                  throw "Could not delete old continuous release asset: $existingAsset"
                }
              }
            }
            gh release upload continuous $asset --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create continuous $asset `
              --prerelease `
              --target $env:GITHUB_SHA `
              --title "Continuous Windows build" `
              --notes "Automatic modern .NET 8 x64 preview from main." `
              --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the continuous build failed with exit code $LASTEXITCODE."
          }

          $publishedAssets = @(gh release view continuous --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($publishedAssets.Count -ne 1 -or $publishedAssets[0] -ne $assetName) {
            throw "Continuous release must contain only $assetName; found: $($publishedAssets -join ', ')"
          }

      - name: Report reproducible build status
        if: ${{ always() }}
        shell: pwsh
        env:
          BUILD_RESULT: ${{ job.status }}
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $state = if ($env:BUILD_RESULT -eq "success") { "success" } else { "failure" }
          $description = if ($state -eq "success") {
            "Modern x64 archive was published."
          }
          else {
            "The reproducible Windows build failed; open the run log."
          }
          $body = @{
            state = $state
            context = "Windows build / reproducible"
            description = $description
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:REPOSITORY_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-RestMethod `
            -Method Post `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $body | Out-Null
