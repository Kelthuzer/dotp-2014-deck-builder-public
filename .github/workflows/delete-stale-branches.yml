name: Delete stale branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-stale-branches.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in \
            'heads/fix/token-runtime-and-ai-avatar' \
            'heads/__invalid_should_not_create__'
          do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"
              echo "Deleted $ref"
            else
              echo "Already absent: $ref"
            fi
          done
